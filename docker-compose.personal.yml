#
# `docker-compose` file used ONLY for hobby deployments.
#
# Please take a look at https://posthog.com/docs/self-host/deploy/hobby
# for more info.
#
# PostHog has sunset support for self-hosted K8s deployments.
# See: https://posthog.com/blog/sunsetting-helm-support-posthog
#

services:
    redis7:
        extends:
            file: docker-compose.base.yml
            service: redis7
        volumes:
            - redis7-data:/data

    clickhouse:
        extends:
            file: docker-compose.base.yml
            service: clickhouse
        restart: on-failure
        depends_on:
            - kafka
            - zookeeper
        volumes:
            - ./posthog/idl:/idl
            - ./docker/clickhouse/docker-entrypoint-initdb.d:/docker-entrypoint-initdb.d
            - ./docker/clickhouse/config.xml:/etc/clickhouse-server/config.xml
            - ./docker/clickhouse/config.d/default.xml:/etc/clickhouse-server/config.d/default.xml
            - ./docker/clickhouse/users.xml:/etc/clickhouse-server/users.xml
            - ./docker/clickhouse/user_defined_function.xml:/etc/clickhouse-server/user_defined_function.xml
            - ./posthog/user_scripts:/var/lib/clickhouse/user_scripts
            - clickhouse-data:/var/lib/clickhouse

    zookeeper:
        extends:
            file: docker-compose.base.yml
            service: zookeeper
        volumes:
            - zookeeper-datalog:/datalog
            - zookeeper-data:/data
            - zookeeper-logs:/logs
    kafka:
        extends:
            file: docker-compose.base.yml
            service: kafka
        depends_on:
            - zookeeper
        environment:
            KAFKA_LOG_RETENTION_MS: 3600000
            KAFKA_LOG_RETENTION_CHECK_INTERVAL_MS: 300000
            KAFKA_LOG_RETENTION_HOURS: 1
        volumes:
            - kafka-data:/bitnami/kafka

    worker:
        extends:
            file: docker-compose.base.yml
            service: worker
        build:
            context: .
            dockerfile: Dockerfile
        environment:
            SITE_URL: https://$DOMAIN
            SECRET_KEY: $POSTHOG_SECRET
            OBJECT_STORAGE_ACCESS_KEY_ID: ${OBJECT_STORAGE_ACCESS_KEY_ID}
            OBJECT_STORAGE_SECRET_ACCESS_KEY: ${OBJECT_STORAGE_SECRET_ACCESS_KEY}
            OBJECT_STORAGE_ENDPOINT: ${OBJECT_STORAGE_ENDPOINT}
            SESSION_RECORDING_V2_S3_ENDPOINT: ${SESSION_RECORDING_V2_S3_ENDPOINT:-$OBJECT_STORAGE_ENDPOINT}
            SESSION_RECORDING_V2_S3_ACCESS_KEY_ID: ${SESSION_RECORDING_V2_S3_ACCESS_KEY_ID:-$OBJECT_STORAGE_ACCESS_KEY_ID}
            SESSION_RECORDING_V2_S3_SECRET_ACCESS_KEY: ${SESSION_RECORDING_V2_S3_SECRET_ACCESS_KEY:-$OBJECT_STORAGE_SECRET_ACCESS_KEY}
            OBJECT_STORAGE_ENABLED: true
            OBJECT_STORAGE_FORCE_PATH_STYLE: 'true'
            DATABASE_URL: ${DATABASE_URL}
            PERSONS_DATABASE_URL: ${DATABASE_URL}
            CYCLOTRON_DATABASE_URL: ${CYCLOTRON_DATABASE_URL}
            PGSSLMODE: ${PGSSLMODE:-require}
            REDIS_URL: 'redis://redis7:6379/'
            ENCRYPTION_SALT_KEYS: $ENCRYPTION_SALT_KEYS
            POSTHOG_SKIP_MIGRATION_CHECKS: '1'
            TEMPORAL_HOST: ${TEMPORAL_HOST:-temporal}
            AWS_REGION: 'us-east-1'
            AWS_DEFAULT_REGION: 'us-east-1'
            SES_REGION: 'us-east-1'
            SES_ACCESS_KEY_ID: ${SES_ACCESS_KEY_ID}
            SES_SECRET_ACCESS_KEY: ${SES_SECRET_ACCESS_KEY}
        depends_on:
            redis7:
                condition: service_healthy
            clickhouse:
                condition: service_started
            kafka:
                condition: service_healthy
            web:
                condition: service_started
    web:
        extends:
            file: docker-compose.base.yml
            service: web
        build:
            context: .
            dockerfile: Dockerfile
        image: posthog-web:latest
        command: /compose/start
        volumes:
            - ./compose:/compose
        environment:
            SITE_URL: https://$DOMAIN
            LIVESTREAM_HOST: 'https://${DOMAIN}/livestream'
            SECRET_KEY: $POSTHOG_SECRET
            OBJECT_STORAGE_ACCESS_KEY_ID: ${OBJECT_STORAGE_ACCESS_KEY_ID}
            OBJECT_STORAGE_SECRET_ACCESS_KEY: ${OBJECT_STORAGE_SECRET_ACCESS_KEY}
            SESSION_RECORDING_V2_S3_ACCESS_KEY_ID: ${SESSION_RECORDING_V2_S3_ACCESS_KEY_ID:-$OBJECT_STORAGE_ACCESS_KEY_ID}
            SESSION_RECORDING_V2_S3_SECRET_ACCESS_KEY: ${SESSION_RECORDING_V2_S3_SECRET_ACCESS_KEY:-$OBJECT_STORAGE_SECRET_ACCESS_KEY}
            OBJECT_STORAGE_ENDPOINT: ${OBJECT_STORAGE_ENDPOINT}
            SESSION_RECORDING_V2_S3_ENDPOINT: ${SESSION_RECORDING_V2_S3_ENDPOINT:-$OBJECT_STORAGE_ENDPOINT}
            OBJECT_STORAGE_ENABLED: true
            OBJECT_STORAGE_FORCE_PATH_STYLE: 'true'
            DATABASE_URL: ${DATABASE_URL}
            PERSONS_DATABASE_URL: ${DATABASE_URL}
            CYCLOTRON_DATABASE_URL: ${CYCLOTRON_DATABASE_URL}
            PGSSLMODE: ${PGSSLMODE:-require}
            REDIS_URL: 'redis://redis7:6379/'
            ENCRYPTION_SALT_KEYS: $ENCRYPTION_SALT_KEYS
            OTEL_SERVICE_NAME: 'posthog'
            OTEL_EXPORTER_OTLP_ENDPOINT: ''
            OTEL_SDK_DISABLED: 'true'
            USE_GRANIAN: 'true'
            GRANIAN_WORKERS: '2'
            TEMPORAL_HOST: ${TEMPORAL_HOST:-temporal}
            OPT_OUT_CAPTURE: ${OPT_OUT_CAPTURE:-false}
            AWS_REGION: 'us-east-1'
            AWS_DEFAULT_REGION: 'us-east-1'
            SES_REGION: 'us-east-1'
            SES_ACCESS_KEY_ID: ${SES_ACCESS_KEY_ID}
            SES_SECRET_ACCESS_KEY: ${SES_SECRET_ACCESS_KEY}
        depends_on:
            - redis7
            - clickhouse
            - kafka

    plugins:
        extends:
            file: docker-compose.base.yml
            service: plugins
        build:
            context: .
            dockerfile: Dockerfile.node
        image: posthog-plugins:latest
        environment:
            SITE_URL: https://$DOMAIN
            SECRET_KEY: $POSTHOG_SECRET
            OBJECT_STORAGE_ACCESS_KEY_ID: ${OBJECT_STORAGE_ACCESS_KEY_ID}
            OBJECT_STORAGE_SECRET_ACCESS_KEY: ${OBJECT_STORAGE_SECRET_ACCESS_KEY}
            SESSION_RECORDING_V2_S3_ACCESS_KEY_ID: ${SESSION_RECORDING_V2_S3_ACCESS_KEY_ID:-$OBJECT_STORAGE_ACCESS_KEY_ID}
            SESSION_RECORDING_V2_S3_SECRET_ACCESS_KEY: ${SESSION_RECORDING_V2_S3_SECRET_ACCESS_KEY:-$OBJECT_STORAGE_SECRET_ACCESS_KEY}
            SESSION_RECORDING_V2_S3_TIMEOUT_MS: 120000
            OBJECT_STORAGE_ENDPOINT: ${OBJECT_STORAGE_ENDPOINT}
            SESSION_RECORDING_V2_S3_ENDPOINT: ${SESSION_RECORDING_V2_S3_ENDPOINT:-$OBJECT_STORAGE_ENDPOINT}
            OBJECT_STORAGE_ENABLED: true
            OBJECT_STORAGE_FORCE_PATH_STYLE: 'true'
            REDIS_URL: 'redis://redis7:6379/'
            REDIS_HOST: 'redis7'
            REDIS_PORT: '6379'
            SESSION_RECORDING_API_REDIS_HOST: 'redis7'
            SESSION_RECORDING_API_REDIS_PORT: '6379'
            CDP_REDIS_HOST: redis7
            CDP_REDIS_PORT: 6379
            CDP_REDIS_PASSWORD: ''
            LOGS_REDIS_HOST: redis7
            LOGS_REDIS_PORT: 6379
            LOGS_REDIS_PASSWORD: ''
            LOGS_REDIS_TLS: 'false'
            ENCRYPTION_SALT_KEYS: $ENCRYPTION_SALT_KEYS
            DATABASE_URL: ${DATABASE_URL}
            PERSONS_DATABASE_URL: ${DATABASE_URL}
            CYCLOTRON_DATABASE_URL: ${CYCLOTRON_DATABASE_URL}
            # Route CDP cyclotron jobs through Postgres so hogflow delay steps are honored.
            # Kafka mode (the code default) ignores scheduled-in-future jobs, collapsing delays.
            CDP_CYCLOTRON_JOB_QUEUE_CONSUMER_MODE: postgres
            CDP_CYCLOTRON_JOB_QUEUE_PRODUCER_MAPPING: '*:postgres'
            BEHAVIORAL_COHORTS_DATABASE_URL: ${DATABASE_URL}
            PGSSLMODE: ${PGSSLMODE:-require}
            NODE_TLS_REJECT_UNAUTHORIZED: '0'
            AWS_REGION: 'us-east-1'
            AWS_DEFAULT_REGION: 'us-east-1'
            SES_REGION: 'us-east-1'
            SES_ACCESS_KEY_ID: ${SES_ACCESS_KEY_ID}
            SES_SECRET_ACCESS_KEY: ${SES_SECRET_ACCESS_KEY}
            OTEL_EXPORTER_OTLP_ENDPOINT: ''
        volumes:
            - ./share:/share
        depends_on:
            - redis7
            - clickhouse
            - kafka

    proxy:
        extends:
            file: docker-compose.base.yml
            service: proxy
        ports:
            - '80:80'
            - '443:443'
        volumes:
            - caddy-data:/data
            - caddy-config:/config
        environment:
            CADDY_TLS_BLOCK: $TLS_BLOCK
            CADDY_HOST: '$DOMAIN, http://, https://'
        depends_on:
            - web
            - livestream

    asyncmigrationscheck:
        extends:
            file: docker-compose.base.yml
            service: asyncmigrationscheck
        build:
            context: .
            dockerfile: Dockerfile
        environment:
            SITE_URL: https://$DOMAIN
            SECRET_KEY: $POSTHOG_SECRET
            DATABASE_URL: ${DATABASE_URL}
            PERSONS_DATABASE_URL: ${DATABASE_URL}
            CYCLOTRON_DATABASE_URL: ${CYCLOTRON_DATABASE_URL}
            PGSSLMODE: ${PGSSLMODE:-require}
            SKIP_ASYNC_MIGRATIONS_SETUP: 0
        volumes:
            - ./share:/share

    # Temporal containers
    temporal:
        restart: always
        environment:
            - DB=postgresql
            - DB_PORT=${TEMPORAL_DB_PORT}
            - BIND_ON_IP=0.0.0.0
            - POSTGRES_USER=${TEMPORAL_DB_USER}
            - POSTGRES_PWD=${TEMPORAL_POSTGRES_PWD}
            - POSTGRES_SEEDS=${TEMPORAL_POSTGRES_HOST}
            - POSTGRES_DB=temporal
            - DYNAMIC_CONFIG_FILE_PATH=config/dynamicconfig/development-sql.yaml
            - VISIBILITY_POSTGRES_DB=temporal_visibility
            - POSTGRES_TLS_ENABLED=true
            - POSTGRES_TLS_DISABLE_HOST_VERIFICATION=true
            - SQL_TLS_ENABLED=true
            - SQL_HOST_VERIFICATION=false
            - ENABLE_ES=false
            - SKIP_SCHEMA_SETUP=true
            - TEMPORAL_BROADCAST_ADDRESS=127.0.0.1
        image: temporalio/auto-setup:1.20.0
        ports:
            - 7233:7233
        volumes:
            - ./docker/temporal/dynamicconfig:/etc/temporal/config/dynamicconfig

    elasticsearch:
        extends:
            file: docker-compose.base.yml
            service: elasticsearch
    temporal-admin-tools:
        extends:
            file: docker-compose.base.yml
            service: temporal-admin-tools
        depends_on:
            - temporal
    temporal-ui:
        extends:
            file: docker-compose.base.yml
            service: temporal-ui
        ports:
            - 8081:8080
        depends_on:
            temporal:
                condition: service_started

    temporal-django-worker:
        command: python3 manage.py start_temporal_worker
        extends:
            file: docker-compose.base.yml
            service: temporal-django-worker
        build:
            context: .
            dockerfile: Dockerfile
        restart: always
        volumes:
            - ./compose:/compose
        environment:
            SITE_URL: https://$DOMAIN
            SECRET_KEY: $POSTHOG_SECRET
            DATABASE_URL: ${DATABASE_URL}
            PERSONS_DATABASE_URL: ${DATABASE_URL}
            CYCLOTRON_DATABASE_URL: ${CYCLOTRON_DATABASE_URL}
            PGSSLMODE: ${PGSSLMODE:-require}
            TEMPORAL_HOST: ${TEMPORAL_HOST:-temporal}
            AWS_REGION: 'us-east-1'
            AWS_DEFAULT_REGION: 'us-east-1'
            SES_REGION: 'us-east-1'
            SES_ACCESS_KEY_ID: ${SES_ACCESS_KEY_ID}
            SES_SECRET_ACCESS_KEY: ${SES_SECRET_ACCESS_KEY}
        depends_on:
            - clickhouse
            - kafka
            - temporal

    temporal-data-warehouse-worker:
        command: python3 manage.py start_temporal_worker --task-queue data-warehouse-task-queue
        extends:
            file: docker-compose.base.yml
            service: temporal-django-worker
        build:
            context: .
            dockerfile: Dockerfile
        restart: always
        environment:
            SITE_URL: https://$DOMAIN
            SECRET_KEY: $POSTHOG_SECRET
            DATABASE_URL: ${DATABASE_URL}
            PERSONS_DATABASE_URL: ${DATABASE_URL}
            CYCLOTRON_DATABASE_URL: ${CYCLOTRON_DATABASE_URL}
            PGSSLMODE: ${PGSSLMODE:-require}
            TEMPORAL_HOST: ${TEMPORAL_HOST:-temporal}
            REDIS_URL: 'redis://redis7:6379/'
            DATA_WAREHOUSE_REDIS_HOST: 'redis7'
            DATA_WAREHOUSE_REDIS_PORT: '6379'
            OBJECT_STORAGE_ACCESS_KEY_ID: ${OBJECT_STORAGE_ACCESS_KEY_ID}
            OBJECT_STORAGE_SECRET_ACCESS_KEY: ${OBJECT_STORAGE_SECRET_ACCESS_KEY}
            OBJECT_STORAGE_ENDPOINT: ${OBJECT_STORAGE_ENDPOINT}
            OBJECT_STORAGE_ENABLED: 'true'
            OBJECT_STORAGE_FORCE_PATH_STYLE: 'true'
            ENCRYPTION_SALT_KEYS: $ENCRYPTION_SALT_KEYS
            AWS_ACCESS_KEY_ID: ${OBJECT_STORAGE_ACCESS_KEY_ID}
            AWS_SECRET_ACCESS_KEY: ${OBJECT_STORAGE_SECRET_ACCESS_KEY}
            AWS_ENDPOINT_URL: ${OBJECT_STORAGE_ENDPOINT}
            AWS_REGION: 'us-east-1'
            AWS_DEFAULT_REGION: 'us-east-1'
            SES_REGION: 'us-east-1'
            SES_ACCESS_KEY_ID: ${SES_ACCESS_KEY_ID}
            SES_SECRET_ACCESS_KEY: ${SES_SECRET_ACCESS_KEY}
            AWS_ALLOW_HTTP: 'true'
            AWS_EC2_METADATA_DISABLED: 'true'
            S3_USE_SSL: 'false'
        depends_on:
            - redis7
            - clickhouse
            - kafka
            - temporal

    temporal-data-modeling-worker:
        command: python3 manage.py start_temporal_worker --task-queue data-modeling-task-queue
        extends:
            file: docker-compose.base.yml
            service: temporal-django-worker
        build:
            context: .
            dockerfile: Dockerfile
        restart: always
        environment:
            SITE_URL: https://$DOMAIN
            SECRET_KEY: $POSTHOG_SECRET
            DATABASE_URL: ${DATABASE_URL}
            PERSONS_DATABASE_URL: ${DATABASE_URL}
            CYCLOTRON_DATABASE_URL: ${CYCLOTRON_DATABASE_URL}
            PGSSLMODE: ${PGSSLMODE:-require}
            TEMPORAL_HOST: ${TEMPORAL_HOST:-temporal}
            REDIS_URL: 'redis://redis7:6379/'
            DATA_WAREHOUSE_REDIS_HOST: 'redis7'
            DATA_WAREHOUSE_REDIS_PORT: '6379'
            OBJECT_STORAGE_ACCESS_KEY_ID: ${OBJECT_STORAGE_ACCESS_KEY_ID}
            OBJECT_STORAGE_SECRET_ACCESS_KEY: ${OBJECT_STORAGE_SECRET_ACCESS_KEY}
            OBJECT_STORAGE_ENDPOINT: ${OBJECT_STORAGE_ENDPOINT}
            OBJECT_STORAGE_ENABLED: 'true'
            OBJECT_STORAGE_FORCE_PATH_STYLE: 'true'
            ENCRYPTION_SALT_KEYS: $ENCRYPTION_SALT_KEYS
            AWS_ACCESS_KEY_ID: ${OBJECT_STORAGE_ACCESS_KEY_ID}
            AWS_SECRET_ACCESS_KEY: ${OBJECT_STORAGE_SECRET_ACCESS_KEY}
            AWS_ENDPOINT_URL: ${OBJECT_STORAGE_ENDPOINT}
            AWS_REGION: 'us-east-1'
            AWS_DEFAULT_REGION: 'us-east-1'
            SES_REGION: 'us-east-1'
            SES_ACCESS_KEY_ID: ${SES_ACCESS_KEY_ID}
            SES_SECRET_ACCESS_KEY: ${SES_SECRET_ACCESS_KEY}
            AWS_ALLOW_HTTP: 'true'
            AWS_EC2_METADATA_DISABLED: 'true'
            S3_USE_SSL: 'false'
        depends_on:
            - redis7
            - clickhouse
            - kafka
            - temporal

    temporal-ducklake-worker:
        command: python3 manage.py start_temporal_worker --task-queue ducklake-task-queue
        extends:
            file: docker-compose.base.yml
            service: temporal-django-worker
        build:
            context: .
            dockerfile: Dockerfile
        restart: always
        environment:
            SITE_URL: https://$DOMAIN
            SECRET_KEY: $POSTHOG_SECRET
            DATABASE_URL: ${DATABASE_URL}
            PERSONS_DATABASE_URL: ${DATABASE_URL}
            CYCLOTRON_DATABASE_URL: ${CYCLOTRON_DATABASE_URL}
            PGSSLMODE: ${PGSSLMODE:-require}
            TEMPORAL_HOST: ${TEMPORAL_HOST:-temporal}
            REDIS_URL: 'redis://redis7:6379/'
            DATA_WAREHOUSE_REDIS_HOST: 'redis7'
            DATA_WAREHOUSE_REDIS_PORT: '6379'
            OBJECT_STORAGE_ACCESS_KEY_ID: ${OBJECT_STORAGE_ACCESS_KEY_ID}
            OBJECT_STORAGE_SECRET_ACCESS_KEY: ${OBJECT_STORAGE_SECRET_ACCESS_KEY}
            OBJECT_STORAGE_ENDPOINT: ${OBJECT_STORAGE_ENDPOINT}
            OBJECT_STORAGE_ENABLED: 'true'
            OBJECT_STORAGE_FORCE_PATH_STYLE: 'true'
            ENCRYPTION_SALT_KEYS: $ENCRYPTION_SALT_KEYS
            AWS_ACCESS_KEY_ID: ${OBJECT_STORAGE_ACCESS_KEY_ID}
            AWS_SECRET_ACCESS_KEY: ${OBJECT_STORAGE_SECRET_ACCESS_KEY}
            AWS_ENDPOINT_URL: ${OBJECT_STORAGE_ENDPOINT}
            AWS_REGION: 'us-east-1'
            AWS_DEFAULT_REGION: 'us-east-1'
            SES_REGION: 'us-east-1'
            SES_ACCESS_KEY_ID: ${SES_ACCESS_KEY_ID}
            SES_SECRET_ACCESS_KEY: ${SES_SECRET_ACCESS_KEY}
            AWS_ALLOW_HTTP: 'true'
            AWS_EC2_METADATA_DISABLED: 'true'
            S3_USE_SSL: 'false'
        depends_on:
            - redis7
            - clickhouse
            - kafka
            - temporal

    cyclotron-janitor:
        image: ghcr.io/posthog/posthog/cyclotron-janitor:master
        build:
            context: ./rust
            args:
                BIN: cyclotron-janitor
        restart: on-failure
        environment:
            DATABASE_URL: ${CYCLOTRON_DATABASE_URL}
            KAFKA_HOSTS: 'kafka:9092'
            KAFKA_TOPIC: 'clickhouse_app_metrics2'
        depends_on:
            kafka:
                condition: service_started

    capture:
        build:
            context: ./rust
        extends:
            file: docker-compose.base.yml
            service: capture

    replay-capture:
        build:
            context: ./rust
        extends:
            file: docker-compose.base.yml
            service: replay-capture

    property-defs-rs:
        build:
            context: ./rust
        extends:
            file: docker-compose.base.yml
            service: property-defs-rs
        environment:
            KAFKA_TLS: 'false'
            DATABASE_URL: ${DATABASE_URL}
            DATABASE_PERSONS_URL: ${DATABASE_URL}
        depends_on:
            kafka-init:
                condition: service_completed_successfully

    livestream:
        extends:
            file: docker-compose.base.yml
            service: livestream
        environment:
            - LIVESTREAM_JWT_SECRET=${POSTHOG_SECRET}
            - DATABASE_URL=${DATABASE_URL}
        volumes:
            - ./docker/livestream/configs-hobby.yml:/configs/configs.yml
            - ./share:/share

    feature-flags:
        build:
            context: ./rust
        extends:
            file: docker-compose.base.yml
            service: feature-flags
        environment:
            KAFKA_TLS: 'false'
            DATABASE_URL: ${DATABASE_URL}
            WRITE_DATABASE_URL: ${DATABASE_URL}
            READ_DATABASE_URL: ${DATABASE_URL}
            PERSONS_WRITE_DATABASE_URL: ${DATABASE_URL}
            PERSONS_READ_DATABASE_URL: ${DATABASE_URL}
        depends_on:
            redis7:
                condition: service_healthy

    kafka-init:
        image: docker.redpanda.com/redpandadata/redpanda:v25.1.9
        entrypoint: /bin/sh
        command:
            - -c
            - |
                set -x
                echo "Waiting for Kafka broker to accept connections..."
                TIMEOUT=60
                ELAPSED=0
                # Use rpk topic list as the readiness check - it's a simple operation
                # that confirms the broker is accepting Kafka protocol requests
                until rpk topic list --brokers kafka:9092 2>/dev/null; do
                    echo "Kafka broker not ready yet (elapsed: ${ELAPSED}s)..."
                    sleep 2
                    ELAPSED=$((ELAPSED + 2))
                    if [ $ELAPSED -ge $TIMEOUT ]; then
                        echo "Timeout waiting for Kafka broker after ${TIMEOUT}s"
                        echo "Final attempt to list topics:"
                        rpk topic list --brokers kafka:9092 || true
                        exit 1
                    fi
                done
                echo "Kafka broker is accepting requests, creating topics..."
                # Create topics needed by rust services
                # Note: $$ escapes $ for docker-compose variable substitution
                for topic in exceptions_ingestion clickhouse_events_json clickhouse_logs; do
                    if rpk topic create "$$topic" --brokers kafka:9092 -p 1 -r 1 2>&1; then
                        echo "Topic $$topic created successfully"
                    else
                        if rpk topic list --brokers kafka:9092 | grep -q "$$topic"; then
                            echo "Topic $$topic already exists, continuing"
                        else
                            echo "Failed to create topic $$topic"
                            exit 1
                        fi
                    fi
                done
                echo "Final topic list:"
                rpk topic list --brokers kafka:9092
                echo "Topics ready"
        depends_on:
            kafka:
                condition: service_healthy

    cymbal:
        image: ghcr.io/posthog/posthog/cymbal:master
        restart: on-failure
        volumes:
            - ./share:/share
        environment:
            KAFKA_HOSTS: 'kafka:9092'
            KAFKA_CONSUMER_GROUP: cymbal
            KAFKA_CONSUMER_TOPIC: exceptions_ingestion
            OBJECT_STORAGE_BUCKET: 'posthog'
            OBJECT_STORAGE_ACCESS_KEY_ID: ${OBJECT_STORAGE_ACCESS_KEY_ID}
            OBJECT_STORAGE_SECRET_ACCESS_KEY: ${OBJECT_STORAGE_SECRET_ACCESS_KEY}
            OBJECT_STORAGE_ENDPOINT: 'https://us-east-1.linodeobjects.com'
            OBJECT_STORAGE_FORCE_PATH_STYLE: 'true'
            BIND_HOST: '0.0.0.0'
            BIND_PORT: '3302'
            DATABASE_URL: '${DATABASE_URL}?sslmode=require'
            PERSONS_URL: '${DATABASE_URL}?sslmode=require'
            DATABASE_PERSONS_URL: '${DATABASE_URL}?sslmode=require'
            MAXMIND_DB_PATH: '/share/GeoLite2-City.mmdb'
            REDIS_URL: 'redis://redis7:6379/'
            ISSUE_BUCKETS_REDIS_URL: 'redis://redis7:6379/'
            RUST_LOG: 'info'
            RUST_BACKTRACE: '1'
            AWS_REGION: 'us-east-1'
            AWS_DEFAULT_REGION: 'us-east-1'
            SES_REGION: 'us-east-1'
        depends_on:
            kafka-init:
                condition: service_completed_successfully

volumes:
    zookeeper-data:
    zookeeper-datalog:
    zookeeper-logs:
    clickhouse-data:
    caddy-data:
    caddy-config:
    redis7-data:
    kafka-data:
    redpanda-data:
